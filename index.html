<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Versículo para Ti</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      transition: background-image 1s ease-in-out;
      background-size: cover;
      background-position: center;
      padding: 20px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(2px);
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 760px;
      padding: 40px 30px;
      border-radius: 30px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
      transition: opacity 0.3s ease;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {opacity:0; transform: translateY(20px);}
      to {opacity:1; transform: translateY(0);}
    }

    .title {
      font-size: 2.3rem;
      font-family: 'Playfair Display', serif;
      margin-bottom: 20px;
      color: #ffe8a3;
    }

    .category {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.15);
      font-size: 0.9rem;
    }

    .verse {
      font-size: 1.7rem;
      line-height: 1.9;
      margin-bottom: 25px;
    }

    .reference {
      font-size: 1.1rem;
      color: #ffe8a3;
      margin-bottom: 35px;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    button {
      border: none;
      padding: 15px 24px;
      border-radius: 18px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);
    }

    .new-btn {
      background: #ffe8a3;
      color: #222;
    }

    .music-btn {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .footer {
      margin-top: 30px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      .title {font-size: 1.9rem;}
      .verse {font-size: 1.2rem;}
      .card {padding: 30px 20px;}
    }
  </style>
</head>

<body>

<div class="overlay"></div>

<div class="card">
  <h1 class="title">Versículo para Ti ✨</h1>

  <div class="category" id="category">PROMESA</div>
  <div class="verse" id="verse"></div>
  <div class="reference" id="reference"></div>

  <div class="buttons">
    <button class="new-btn" onclick="showRandomVerse()">Nuevo Versículo</button>
    <button class="music-btn" onclick="toggleMusic()" id="musicButton">▶️ Música</button>
  </div>

  <div class="footer">
    Dios tiene una palabra para ti cada momento EAGC ❤️
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="HD  Cuerdas de amor  Pista  Karaoke  Julio Melgar  Tonalidad - E.mp3" type="audio/mpeg">
</audio>

<script>

const verses = [
  { category:'FORTALEZA', text:'Todo lo puedo en Cristo que me fortalece.', reference:'Filipenses 4:13' },
  { category:'PROMESA', text:'Porque yo sé los planes que tengo para ustedes.', reference:'Jeremías 29:11' },
  { category:'PAZ', text:'La paz de Dios guardará sus corazones.', reference:'Filipenses 4:7' },
  { category:'AMOR', text:'El amor nunca deja de ser.', reference:'1 Corintios 13:8' },
  { category:'ÁNIMO', text:'No temas, porque yo estoy contigo.', reference:'Isaías 41:10' },
  { category:'ESPERANZA', text:'Dios es nuestro refugio y fortaleza.', reference:'Salmos 46:1' },
  { category:'FE', text:'Nada hay imposible para Dios.', reference:'Lucas 1:37' },
  { category:'CONSUELO', text:'Venid a mí y yo os haré descansar.', reference:'Mateo 11:28' },
  { category:'MOTIVACIÓN', text:'Todo tiene su tiempo.', reference:'Eclesiastés 3:1' },
  { category:'GOZO', text:'Este es el día que hizo Jehová.', reference:'Salmos 118:24' }
];

const backgrounds = [
'https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1600',
'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1600',
'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600',
'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?q=80&w=1600',
'https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=1600',
'https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=1600',
'https://images.unsplash.com/photo-1502082553048-f009c37129b9?q=80&w=1600',
'https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?q=80&w=1600',
'https://images.unsplash.com/photo-1511497584788-876760111969?q=80&w=1600',
'https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?q=80&w=1600'
];

function showRandomVerse() {

  const card = document.querySelector('.card');
  card.style.opacity = '0';

  setTimeout(() => {

    const v = verses[Math.floor(Math.random()*verses.length)];
    const bg = backgrounds[Math.floor(Math.random()*backgrounds.length)];

    document.getElementById('verse').innerText = `"${v.text}"`;
    document.getElementById('reference').innerText = v.reference;
    document.getElementById('category').innerText = v.category;

    document.body.style.backgroundImage = `url('${bg}')`;

    card.style.opacity = '1';

  }, 300);
}

const music = document.getElementById('bgMusic');
const musicButton = document.getElementById('musicButton');

function toggleMusic() {

  if (music.paused) {

    music.volume = 0.18;
    music.currentTime = 0;

    music.play().then(() => {
      musicButton.innerText = '⏸️ Pausar Música';
    }).catch(() => {
      console.log('Bloqueado por navegador');
    });

  } else {
    music.pause();
    musicButton.innerText = '▶️ Música';
  }
}

showRandomVerse();

</script>

</body>
</html>
