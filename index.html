<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Versículo para Ti</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      transition: background-image 1s ease-in-out;
      background-size: cover;
      background-position: center;
      padding: 20px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(2px);
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 760px;
      padding: 40px 30px;
      border-radius: 30px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
      transition: opacity 0.3s ease;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {opacity:0; transform: translateY(20px);}
      to {opacity:1; transform: translateY(0);}
    }

    .title {
      font-size: 2.3rem;
      font-family: 'Playfair Display', serif;
      margin-bottom: 20px;
      color: #ffe8a3;
    }

    .category {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.15);
      font-size: 0.9rem;
    }

    .verse {
      font-size: 1.7rem;
      line-height: 1.9;
      margin-bottom: 25px;
    }

    .reference {
      font-size: 1.1rem;
      color: #ffe8a3;
      margin-bottom: 35px;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    button {
      border: none;
      padding: 15px 24px;
      border-radius: 18px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);
    }

    .new-btn {
      background: #ffe8a3;
      color: #222;
    }

    .music-btn {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .footer {
      margin-top: 30px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      .title {font-size: 1.9rem;}
      .verse {font-size: 1.2rem;}
      .card {padding: 30px 20px;}
    }
  </style>
</head>

<body>

<div class="overlay"></div>

<div class="card">
  <h1 class="title">Versículo para Ti ✨</h1>

  <div class="category" id="category">PROMESA</div>
  <div class="verse" id="verse"></div>
  <div class="reference" id="reference"></div>

  <div class="buttons">
    <button class="new-btn" onclick="showRandomVerse()">Nuevo Versículo</button>
    <button class="music-btn" onclick="toggleMusic()" id="musicButton">▶️ Música</button>
  </div>

  <div class="footer">
    Dios tiene una palabra para ti cada momento EAGC ❤️
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="HD  Cuerdas de amor  Pista  Karaoke  Julio Melgar  Tonalidad - E.mp3" type="audio/mpeg">
</audio>

<script>

  { category:'FORTALEZA', text:'Todo lo puedo en Cristo que me fortalece, porque aun en medio de las dificultades Dios renueva mis fuerzas y me sostiene cada día.', reference:'Filipenses 4:13' },
{ category:'PROMESA', text:'Porque yo sé muy bien los planes que tengo para ustedes, planes de bienestar y no de calamidad, a fin de darles un futuro lleno de esperanza.', reference:'Jeremías 29:11' },
{ category:'PAZ', text:'La paz de Dios, que sobrepasa todo entendimiento, guardará sus corazones y sus pensamientos en Cristo Jesús.', reference:'Filipenses 4:7' },

{ category:'ESPERANZA', text:'Dios es nuestro refugio y nuestra fuerza, nuestra ayuda segura en momentos de angustia.', reference:'Salmos 46:1' },
{ category:'FE', text:'Para Dios no hay absolutamente nada imposible, aun aquello que parece perdido puede transformarse por su poder.', reference:'Lucas 1:37' },
{ category:'CONSUELO', text:'Vengan a mí todos los que están cansados y agobiados, y yo les daré descanso para su alma.', reference:'Mateo 11:28' },
{ category:'MOTIVACIÓN', text:'Todo tiene su momento oportuno; hay un tiempo perfecto para todo lo que sucede debajo del cielo.', reference:'Eclesiastés 3:1' },
{ category:'GOZO', text:'Este es el día que hizo el Señor; nos gozaremos y alegraremos en él sin importar las circunstancias.', reference:'Salmos 118:24' },
{ category:'FORTALEZA', text:'Los que esperan en el Señor renovarán sus fuerzas; levantarán alas como las águilas y no se cansarán.', reference:'Isaías 40:31' },

{ category:'FE', text:'Confía en el Señor con todo tu corazón y no dependas de tu propio entendimiento.', reference:'Proverbios 3:5' },
{ category:'ÁNIMO', text:'Esfuérzate y sé valiente; no temas ni desmayes, porque Jehová tu Dios estará contigo dondequiera que vayas.', reference:'Josué 1:9' },
{ category:'PAZ', text:'Estén quietos y reconozcan que yo soy Dios, soberano sobre toda la tierra.', reference:'Salmos 46:10' },

{ category:'AMOR', text:'Nada podrá separarnos del amor de Dios que es en Cristo Jesús nuestro Señor.', reference:'Romanos 8:39' },
{ category:'CONSUELO', text:'Depositen en él toda ansiedad, porque él cuida de ustedes con amor eterno.', reference:'1 Pedro 5:7' },
{ category:'GOZO', text:'Los que siembran con lágrimas cosecharán con cantos de alegría y esperanza.', reference:'Salmos 126:5' },
{ category:'PAZ', text:'El Señor da fuerza a su pueblo y bendice con paz a quienes confían en él.', reference:'Salmos 29:11' },
{ category:'PROMESA', text:'Pidan y se les dará; busquen y encontrarán; llamen y se les abrirá la puerta.', reference:'Mateo 7:7' },

{ category:'FORTALEZA', text:'Dios es quien me reviste de fuerza y perfecciona mi camino cada día.', reference:'Salmos 18:32' },
{ category:'AMOR', text:'Ama al Señor tu Dios con todo tu corazón, con toda tu alma y con toda tu mente.', reference:'Mateo 22:37' },
{ category:'GOZO', text:'En tu presencia hay plenitud de gozo y alegrías eternas a tu lado.', reference:'Salmos 16:11' },
{ category:'PAZ', text:'Bienaventurados los que trabajan por la paz, porque serán llamados hijos de Dios.', reference:'Mateo 5:9' },
{ category:'PROMESA', text:'Y sabemos que Dios hace que todas las cosas cooperen para el bien de quienes lo aman.', reference:'Romanos 8:28' },
{ category:'MOTIVACIÓN', text:'Corramos con perseverancia la carrera que tenemos por delante, puestos los ojos en Jesús.', reference:'Hebreos 12:1-2' },
{ category:'FE', text:'El justo vivirá por la fe y permanecerá firme confiando en Dios.', reference:'Romanos 1:17' },
{ category:'ÁNIMO', text:'Aunque caiga, no quedará postrado, porque el Señor lo sostiene de la mano.', reference:'Salmos 37:24' },
{ category:'CONSUELO', text:'Tus misericordias son nuevas cada mañana; grande es tu fidelidad.', reference:'Lamentaciones 3:22-23' },
{ category:'ESPERANZA', text:'Mantengamos firme la esperanza que profesamos, porque fiel es el que hizo la promesa.', reference:'Hebreos 10:23' }
];

const backgrounds = [
'https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1600',
'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1600',
'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600',
'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?q=80&w=1600',
'https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=1600',
'https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=1600',
'https://images.unsplash.com/photo-1502082553048-f009c37129b9?q=80&w=1600',
'https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?q=80&w=1600',
'https://images.unsplash.com/photo-1511497584788-876760111969?q=80&w=1600',
'https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?q=80&w=1600'
];

function showRandomVerse() {

  const card = document.querySelector('.card');
  card.style.opacity = '0';

  setTimeout(() => {

    const v = verses[Math.floor(Math.random()*verses.length)];
    const bg = backgrounds[Math.floor(Math.random()*backgrounds.length)];

    document.getElementById('verse').innerText = `"${v.text}"`;
    document.getElementById('reference').innerText = v.reference;
    document.getElementById('category').innerText = v.category;

    document.body.style.backgroundImage = `url('${bg}')`;

    card.style.opacity = '1';

  }, 300);
}

const music = document.getElementById('bgMusic');
const musicButton = document.getElementById('musicButton');

function toggleMusic() {

  if (music.paused) {

    music.volume = 0.18;
    music.currentTime = 0;

    music.play().then(() => {
      musicButton.innerText = '⏸️ Pausar Música';
    }).catch(() => {
      console.log('Bloqueado por navegador');
    });

  } else {
    music.pause();
    musicButton.innerText = '▶️ Música';
  }
}

showRandomVerse();

</script>

</body>
</html>
