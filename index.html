<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <title>Versículo para Ti</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      transition: background-image 1s ease-in-out;
      background-size: cover;
      background-position: center;
      padding: 20px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(2px);
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 760px;
      padding: 40px 30px;
      border-radius: 30px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
      transition: opacity 0.3s ease;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {opacity:0; transform: translateY(20px);}
      to {opacity:1; transform: translateY(0);}
    }

    .title {
      font-size: 2.3rem;
      font-family: 'Playfair Display', serif;
      margin-bottom: 20px;
      color: #ffe8a3;
    }

    .category {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.15);
      font-size: 0.9rem;
    }

    .verse {
      font-size: 1.7rem;
      line-height: 1.9;
      margin-bottom: 25px;
    }

    .reference {
      font-size: 1.1rem;
      color: #ffe8a3;
      margin-bottom: 35px;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    button {
      border: none;
      padding: 15px 24px;
      border-radius: 18px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);
    }

    .new-btn {
      background: #ffe8a3;
      color: #222;
    }

    .music-btn {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .footer {
      margin-top: 30px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      .title {font-size: 1.9rem;}
      .verse {font-size: 1.2rem;}
      .card {padding: 30px 20px;}
    }
  </style>
</head>

</div>

</div>

function showRandomVerse() {

  const card = document.querySelector('.card');
  card.style.opacity = '0';

  setTimeout(() => {

    const v = verses[Math.floor(Math.random()*verses.length)];
    currentVerse = v;
    const bg = backgrounds[Math.floor(Math.random()*backgrounds.length)];

    document.getElementById('verse').innerText = `"${v.text}"`;
    document.getElementById('reference').innerText = v.reference;
    document.getElementById('category').innerText = v.category;

    document.body.style.backgroundImage = `url('${bg}')`;

    card.style.opacity = '1';

  }, 300);
}

const music = document.getElementById('bgMusic');
const musicButton = document.getElementById('musicButton');
  let currentVerse = null;

function toggleMusic() {
  function saveFavorite() {

  if (!currentVerse) return;

  let favorites = JSON.parse(localStorage.getItem('favorites')) || [];

  const exists = favorites.some(f =>
    f.text === currentVerse.text
  );

  if (!exists) {
    favorites.push(currentVerse);
    localStorage.setItem('favorites', JSON.stringify(favorites));

    alert('❤️ Versículo guardado');
  } else {
    alert('📖 Ya estaba guardado');
  }
}

function showFavorites() {

  let favorites = JSON.parse(localStorage.getItem('favorites')) || [];

  if (favorites.length === 0) {
    alert('No tienes versículos guardados');
    return;
  }

  const randomFavorite =
    favorites[Math.floor(Math.random() * favorites.length)];

  document.getElementById('verse').innerText =
    `"${randomFavorite.text}"`;

  document.getElementById('reference').innerText =
    randomFavorite.reference;

  document.getElementById('category').innerText =
    randomFavorite.category;
}

  if (music.paused) {

    music.volume = 0.25;
    music.currentTime = 0;

    music.play().then(() => {
      musicButton.innerText = '⏸️ Pausar Música';
    }).catch(() => {
      console.log('Bloqueado por navegador');
    });

  } else {
    music.pause();
    musicButton.innerText = '▶️ Música';
  }
}
