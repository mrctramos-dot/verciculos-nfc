<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Versículo para Ti</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      transition: background-image 1s ease-in-out;
      background-size: cover;
      background-position: center;
      padding: 20px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(2px);
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 760px;
      padding: 40px 30px;
      border-radius: 30px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .title {
      font-size: 2.3rem;
      font-family: 'Playfair Display', serif;
      margin-bottom: 20px;
      color: #ffe8a3;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .category {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.15);
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .verse {
      font-size: 1.5rem;
      line-height: 1.8;
      margin-bottom: 25px;
      font-weight: 400;
    }

    .reference {
      font-size: 1.1rem;
      color: #ffe8a3;
      margin-bottom: 35px;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    button {
      border: none;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }

    .new-btn {
      background: #ffe8a3;
      color: #222;
    }

    .new-btn:hover {
      transform: scale(1.05);
    }

    .music-btn {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .music-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    .footer {
      margin-top: 30px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      .title {
        font-size: 1.9rem;
      }

      .verse {
        font-size: 1.2rem;
      }

      .card {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="overlay"></div>

  <div class="card">
    <h1 class="title">Versículo para Ti ✨</h1>

    <div class="category" id="category">PROMESA</div>

    <div class="verse" id="verse"></div>

    <div class="reference" id="reference"></div>

    <div class="buttons">
      <button class="new-btn" onclick="showRandomVerse()">
        Nuevo Versículo
      </button>

      <button class="music-btn" onclick="toggleMusic()" id="musicButton">
        ▶️ Música
      </button>
    </div>

    <div class="footer">
      Dios tiene una palabra para ti cada momento EAGC ❤️
    </div>
  </div>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/25/audio_946b7e16b5.mp3" type="audio/mpeg">
</audio>

  <script>

      {

      },
      {
        category: 'MOTIVACIÓN',
        text: 'Levántate y resplandece, porque ha venido tu luz.',
        reference: 'Isaías 60:1'
      },
      {
        category: 'FE',
        text: 'Para Dios no hay nada imposible.',
        reference: 'Lucas 1:37'
       },
        {
  category: 'ESPERANZA',
  text: 'Porque nada hay imposible para Dios.',
  reference: 'Lucas 1:37'
},
{
  category: 'FE',
  text: 'Confía en Jehová con todo tu corazón y no te apoyes en tu propia prudencia.',
  reference: 'Proverbios 3:5'
},
{
  category: 'FORTALEZA',
  text: 'Jehová peleará por vosotros, y vosotros estaréis tranquilos.',
  reference: 'Éxodo 14:14'
},
{
  category: 'PAZ',
  text: 'La paz de Dios, que sobrepasa todo entendimiento, guardará sus corazones.',
  reference: 'Filipenses 4:7'
},
{
  category: 'AMOR',
  text: 'Sobre todas estas cosas vestíos de amor, que es el vínculo perfecto.',
  reference: 'Colosenses 3:14'
},
{
  category: 'ÁNIMO',
  text: 'Esfuérzate y sé valiente; no temas ni desmayes.',
  reference: 'Josué 1:9'
},
{
  category: 'PROMESA',
  text: 'Clama a mí y yo te responderé.',
  reference: 'Jeremías 33:3'
},
{
  category: 'CONSUELO',
  text: 'Cercano está Jehová a los quebrantados de corazón.',

  reference: 'Salmos 46:10'
},
{

  reference: '2 Corintios 12:9'
},
{
  category: 'FE',

  reference: '2 Corintios 5:7'
},
{
  category: 'PROMESA',

},
{
  category: 'CONSUELO',

  reference: 'Mateo 11:28'
},
{
  category: 'MOTIVACIÓN',
  text: 'Todo lo puedo en Cristo que me fortalece.',
  reference: 'Filipenses 4:13'
      }
    ];

    const backgrounds = [
      'https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1600&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1600&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?q=80&w=1600&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=1600&auto=format&fit=crop'
    ];

    function showRandomVerse() {
      const randomVerse = verses[Math.floor(Math.random() * verses.length)];
      const randomBg = backgrounds[Math.floor(Math.random() * backgrounds.length)];

      document.getElementById('verse').innerText = `“${randomVerse.text}”`;
      document.getElementById('reference').innerText = randomVerse.reference;
      document.getElementById('category').innerText = randomVerse.category;

      document.body.style.backgroundImage = `url('${randomBg}')`;
    }

    const music = document.getElementById('bgMusic');
    const musicButton = document.getElementById('musicButton');

function toggleMusic() {

  if (music.paused) {

    music.volume = 0.18;

    music.play()
      .then(() => {
        musicButton.innerText = '⏸️ Pausar Música';
      })
      .catch(error => {
        alert('El navegador bloqueó la música. Tocá otra vez.');
        console.log(error);
      });

  } else {

    music.pause();
    musicButton.innerText = '▶️ Música';

  }
}

    showRandomVerse();

  </script>

</body>
</html>
